# Prüft jede Änderung, bevor sie Probleme macht. Läuft ohne Zugangsdaten und nur gegen eine
# lokale Test-Datenbank im Runner, die Online-Datenbank wird nie berührt.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ein neuer Push bricht den älteren Lauf desselben Branches ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, Tests und Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Pakete installieren
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit-Tests
        run: bun run test
      - name: Typecheck und Build
        run: bun run build

  database:
    name: Datenbank-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Pakete installieren
        run: bun install --frozen-lockfile
      # Spielt alle Migrationen auf eine leere Datenbank ein und prüft so auch die Reihenfolge.
      - name: Lokale Datenbank starten
        run: bunx supabase start
      - name: pgTAP-Tests
        run: bun run test:db
      - name: Generierte Typen sind aktuell
        run: |
          bunx supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -q /tmp/database.types.ts src/lib/database.types.ts; then
            echo "src/lib/database.types.ts passt nicht zum Schema. Neu erzeugen mit: bunx supabase gen types typescript --local"
            exit 1
          fi
      - name: Datenbank stoppen
        if: always()
        run: bunx supabase stop --no-backup
