# Supabase pausiert kostenlose Projekte nach längerer Inaktivität.
# Diese Abfrage hält die Datenbank aktiv und meldet einen Fehler, falls sie nicht erreichbar ist.
name: Datenbank aktiv halten

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Datenbank abfragen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Ohne Login verweigert die Datenbank den Zugriff (42501). Genau diese Antwort
          # beweist, dass sie läuft, und es werden dabei keine Trainingsdaten gelesen.
          body=$(curl --silent --max-time 30 --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/exercises?select=id&limit=1")
          case "$body" in
            *'"code":"42501"'*) echo "Datenbank ist aktiv." ;;
            *) echo "Unerwartete Antwort, die Datenbank ist vermutlich pausiert."; exit 1 ;;
          esac
